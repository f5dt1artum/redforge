[project]
name = "redforge"
version = "0.1.0"
description = "渗透测试与攻防演练平台"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
